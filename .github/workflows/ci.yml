name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # Temporary PR24 formatted document snapshot; removed from final diff.
      - name: Temporary PR24 Prettier output
        shell: bash
        run: |
          set -euo pipefail
          file=docs/real-npm-artifact-provenance.md
          pnpm exec prettier --write "$file"
          echo "DHFMTSTART:$file"
          base64 -w0 "$file"
          echo
          echo "DHFMTEND:$file"
      - name: Formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
