name: Temporary Native Runtime Formatter Diff
on:
  pull_request:
    paths:
      - 'packages/runner/native-runtime-smoke.mjs'
      - '.github/workflows/tmp-runtime-format.yml'
permissions:
  contents: read
jobs:
  formatter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier diff
        run: |
          pnpm exec prettier --write packages/runner/native-runtime-smoke.mjs
          git diff -- packages/runner/native-runtime-smoke.mjs
