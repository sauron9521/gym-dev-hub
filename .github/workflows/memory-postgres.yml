name: Memory PostgreSQL & Prisma 7 (opt-in test DB)

on:
  pull_request:
    paths:
      - 'apps/api/prisma/**'
      - 'apps/api/prisma.config.ts'
      - 'apps/api/src/database/**'
      - 'apps/api/src/memory/**'
      - 'apps/api/src/security/memory-principal-binding.ts'
      - 'apps/api/src/security/memory-http-identity.ts'
      - 'apps/api/src/security/memory-operator-credential.service.ts'
      - 'apps/api/src/security/memory-operator-credential.controller.ts'
      - 'apps/api/src/security/memory-operator-identity.service.ts'
      - 'apps/api/src/security/memory-operator-identity.controller.ts'
      - 'apps/api/test/memory-read.integration.spec.ts'
      - 'apps/api/test/memory-principal-binding.integration.spec.ts'
      - 'apps/api/test/memory-operator-credential.spec.ts'
      - 'apps/api/test/memory-operator-http.e2e.spec.ts'
      - 'apps/api/test/memory-operator-identity-http.e2e.spec.ts'
      - 'apps/api/test/memory-operator-identity.integration.spec.ts'
      - 'apps/api/test/memory-controller.spec.ts'
      - 'apps/api/test/memory-authenticated-read-http.e2e.spec.ts'
      - 'apps/api/test/memory-proposal.integration.spec.ts'
      - 'apps/api/test/memory-approval.integration.spec.ts'
      - 'apps/api/test/memory-supersede-http.e2e.spec.ts'
      - 'apps/api/test/memory-approval-http.e2e.spec.ts'
      - 'apps/api/test/memory-proposal-http.e2e.spec.ts'
      - 'apps/api/test/memory-proposal-authorization.spec.ts'
      - 'packages/contracts/src/memory-read*'
      - 'apps/api/test/memory-database-*.spec.ts'
      - 'apps/api/test/memory-status.controller.spec.ts'
      - 'apps/api/scripts/memory-db-control.mjs'
      - 'apps/api/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'compose.memory.yml'
      - '.github/workflows/memory-postgres.yml'
  push:
    branches: [main]
    paths:
      - 'apps/api/prisma/**'
      - 'apps/api/prisma.config.ts'
      - 'apps/api/src/database/**'
      - 'apps/api/src/memory/**'
      - 'apps/api/src/security/memory-principal-binding.ts'
      - 'apps/api/src/security/memory-http-identity.ts'
      - 'apps/api/src/security/memory-operator-credential.service.ts'
      - 'apps/api/src/security/memory-operator-credential.controller.ts'
      - 'apps/api/src/security/memory-operator-identity.service.ts'
      - 'apps/api/src/security/memory-operator-identity.controller.ts'
      - 'apps/api/test/memory-read.integration.spec.ts'
      - 'apps/api/test/memory-principal-binding.integration.spec.ts'
      - 'apps/api/test/memory-operator-credential.spec.ts'
      - 'apps/api/test/memory-operator-http.e2e.spec.ts'
      - 'apps/api/test/memory-operator-identity-http.e2e.spec.ts'
      - 'apps/api/test/memory-operator-identity.integration.spec.ts'
      - 'apps/api/test/memory-controller.spec.ts'
      - 'apps/api/test/memory-authenticated-read-http.e2e.spec.ts'
      - 'apps/api/test/memory-proposal.integration.spec.ts'
      - 'apps/api/test/memory-approval.integration.spec.ts'
      - 'apps/api/test/memory-supersede-http.e2e.spec.ts'
      - 'apps/api/test/memory-approval-http.e2e.spec.ts'
      - 'apps/api/test/memory-proposal-http.e2e.spec.ts'
      - 'apps/api/test/memory-proposal-authorization.spec.ts'
      - 'packages/contracts/src/memory-read*'
      - 'apps/api/package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/memory-postgres.yml'

permissions:
  contents: read

concurrency:
  group: memory-postgres-${{ github.ref }}
  cancel-in-progress: true

jobs:
  memory-test:
    name: Isolated Hub test database / Prisma migration (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gym_dev_hub
          POSTGRES_DB: gym_dev_hub_memory_test
          # Disposable CI-only test fixture; no user/system secrets used.
          POSTGRES_PASSWORD: ci-only-database-fixture
        ports:
          - 55441:5432
        options: >-
          --health-cmd "pg_isready -U gym_dev_hub -d gym_dev_hub_memory_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 12
    env:
      DEV_HUB_MEMORY_ENABLE: 'true'
      DEV_HUB_MEMORY_TEST_DATABASE_URL: postgresql://gym_dev_hub:ci-only-database-fixture@127.0.0.1:55441/gym_dev_hub_memory_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install frozen dependencies with Prisma lifecycle hooks denied
        run: pnpm install --frozen-lockfile
      - name: Validate Prisma schema, generate client explicitly
        run: |
          pnpm --filter @gym-dev-hub/api exec prisma validate --config prisma.config.ts
          pnpm --filter @gym-dev-hub/api db:generate
      - name: Apply migration against dedicated test DB ONLY
        run: pnpm --filter @gym-dev-hub/api db:migrate:test
      - name: Verify migration ledger / test target / connection
        run: pnpm --filter @gym-dev-hub/api db:health:test
      - name: Build shared contracts for standalone integration tests
        run: pnpm --filter @gym-dev-hub/contracts build
      - name: Run actual PostgreSQL integration and negative tests
        run: pnpm --filter @gym-dev-hub/api exec vitest run test/memory-database-policy.spec.ts test/memory-database-integration.spec.ts test/memory-records.integration.spec.ts test/memory-read.integration.spec.ts test/memory-principal-binding.integration.spec.ts test/memory-proposal.integration.spec.ts test/memory-operator-identity.integration.spec.ts test/memory-approval.integration.spec.ts test/memory-controller.spec.ts test/memory-status.controller.spec.ts
      - name: Complete frozen repository checks
        run: pnpm check
