name: Temporary PR14 formatter - remove before review
on:
  push:
    branches: [feat/worktree-integrity-mount-preflight]
    paths:
      - '.github/workflows/_temporary-pr14-formatter.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/worktree-integrity-mount-preflight
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format only flagged files
        run: |
          pnpm exec prettier --write \
            apps/api/src/worktree/worktree-integrity.service.ts \
            apps/api/test/worktree-hydration.spec.ts \
            apps/web/src/app/workspace/worktree-integrity-panel.tsx \
            docs/worktree-integrity.md
      - name: Commit formatting to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            apps/api/src/worktree/worktree-integrity.service.ts \
            apps/api/test/worktree-hydration.spec.ts \
            apps/web/src/app/workspace/worktree-integrity-panel.tsx \
            docs/worktree-integrity.md
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Prettier to integrity preflight"
            git push origin HEAD:refs/heads/feat/worktree-integrity-mount-preflight
          fi
