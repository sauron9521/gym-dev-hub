name: Temporary read-only Prettier capture

on:
  pull_request:
    paths:
      - 'scripts/pinned-provision-recovery*'
      - '.github/workflows/temporary-prettier-capture.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Capture reviewed formatting (no Git writes or secrets)
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write scripts/pinned-provision-recovery.mjs scripts/pinned-provision-recovery.test.mjs
          printf 'RECOVERY_FORMAT_A='
          base64 -w0 scripts/pinned-provision-recovery.mjs
          printf '\nRECOVERY_FORMAT_B='
          base64 -w0 scripts/pinned-provision-recovery.test.mjs
          printf '\nRECOVERY_FORMAT_END\n'
