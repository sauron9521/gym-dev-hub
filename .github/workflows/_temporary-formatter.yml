name: Temporary formatter - remove before merge
on:
  push:
    branches: [feat/worktree-hydration-inspection]
    paths:
      - .github/workflows/_temporary-formatter.yml
permissions:
  contents: write

jobs:
  format-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/worktree-hydration-inspection
          persist-credentials: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format only PR #11 files
        run: |
          pnpm exec prettier --write \
            apps/api/src/worktree/worktree-inspection.service.ts \
            apps/api/test/worktree-inspection.spec.ts \
            apps/web/src/app/globals.css \
            apps/web/src/app/workspace/worktree-inspection-panel.tsx \
            docs/worktree-inspection.md

      - name: Commit formatting to same feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            apps/api/src/worktree/worktree-inspection.service.ts \
            apps/api/test/worktree-inspection.spec.ts \
            apps/web/src/app/globals.css \
            apps/web/src/app/workspace/worktree-inspection-panel.tsx \
            docs/worktree-inspection.md
          if ! git diff --cached --quiet; then
            git commit -m "style: apply repository Prettier formatting to PR 11"
            git push origin HEAD:refs/heads/feat/worktree-hydration-inspection
          fi
