name: Temporary formatter - remove before merge
on:
  push:
    branches: [feat/worktree-hydration-inspection]
    paths:
      - .github/workflows/_temporary-formatter.yml
permissions:
  contents: write
jobs:
  format-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/worktree-hydration-inspection
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format scope
        run: |
          pnpm exec prettier --write \
            apps/api/src/worktree/worktree-git.service.ts \
            apps/api/src/worktree/worktree-inspection.service.ts
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/api/src/worktree/worktree-git.service.ts apps/api/src/worktree/worktree-inspection.service.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format Windows path hardening"
            git push origin HEAD:refs/heads/feat/worktree-hydration-inspection
          fi
