name: Private Prisma 7 Client Generation (CI-only)

on:
  pull_request:
    paths:
      - 'packages/runner/**'
      - 'scripts/api-typecheck-provisioning-gate.mjs'
      - '.github/workflows/private-prisma-native-preflight.yml'
  push:
    branches: [main]
    paths:
      - 'packages/runner/**'
      - '.github/workflows/private-prisma-native-preflight.yml'

permissions:
  contents: read

concurrency:
  group: private-prisma-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prisma-client:
    name: Pinned Prisma 7 generator / private offline Docker copy
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout immutable public Gym Platform source
        uses: actions/checkout@v4
        with:
          repository: sauron9521/gym-platform
          ref: 7104f723c4ee7b81e7b9b64e9c9483aea344ef7a
          path: .audit/gym-platform
          fetch-depth: 1
          persist-credentials: false

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify exact Git snapshot, dependency lock, and fixed API recipe
        shell: bash
        run: |
          set -euo pipefail
          git -C .audit/gym-platform diff --quiet
          test "$(git -C .audit/gym-platform rev-parse HEAD)" = '7104f723c4ee7b81e7b9b64e9c9483aea344ef7a'
          test "$(git -C .audit/gym-platform rev-parse HEAD^{tree})" = '2c140e1e740b3dd8cc7582db726f46b54b73b334'
          node scripts/api-typecheck-provisioning-gate.mjs .audit/gym-platform > "$RUNNER_TEMP/api-provisioning.json"
          node --input-type=module - "$RUNNER_TEMP/api-provisioning.json" <<'NODE'
          import { readFileSync } from 'node:fs';
          const info = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          if (
            info.event !== 'api-typecheck-provisioning-gate' ||
            info.sourceManifestSha256 !== 'dd06a6e61c08886f8c783ffe51152854ed6aeca44115659fabc884d5b180bb0b' ||
            info.lockSha512Pins !== 1631 ||
            info.resolvedDirectCount < 35 ||
            info.provisionReady !== false ||
            info.executionEnabled !== false
          ) throw new Error('Unreviewed API provisioning request');
          console.log('Verified real pinned Gym API importer, including all direct package SRI.');
          NODE

      - name: Export tracked-only full source snapshot and reviewed Git manifest
        shell: bash
        run: |
          set -euo pipefail
          source="$(mktemp -d)"
          manifest="$(mktemp -d)"
          chmod 755 "$source" "$manifest"
          echo "GYM_SOURCE_SNAPSHOT=$source" >> "$GITHUB_ENV"
          echo "GYM_SOURCE_MANIFEST=$manifest" >> "$GITHUB_ENV"
          git -C .audit/gym-platform ls-tree -r --long -z HEAD > "$manifest/tracked-files.bin"
          echo "dd06a6e61c08886f8c783ffe51152854ed6aeca44115659fabc884d5b180bb0b  $manifest/tracked-files.bin" | sha256sum -c --status
          (cd .audit/gym-platform && git archive --format=tar HEAD) | tar -xf - -C "$source"
          test "$(find "$source" -type f | wc -l)" -eq 1258
          test -z "$(find "$source" -type l -print -quit)"
          test ! -e "$source/.git"

      - name: Trusted network stage — install filtered real API dependency graph without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          store="$(mktemp -d)"
          echo "GYM_API_PNPM_STORE=$store" >> "$GITHUB_ENV"
          test "$(pnpm --version)" = '12.18.0'
          (
            cd .audit/gym-platform
            pnpm --filter @gym/api install \
              --frozen-lockfile --ignore-scripts --trust-lockfile --store-dir "$store"
          )
          test -z "$(git -C .audit/gym-platform status --porcelain --untracked-files=normal)"
          # pnpm 12 writes an index backlink to the trusted CI checkout.
          # Only known project-index symlinks may be deleted. Reject any others.
          projects="$store/v11/projects"
          if [ -d "$projects" ]; then
            for entry in "$projects"/*; do
              if [ ! -e "$entry" ] && [ ! -L "$entry" ]; then continue; fi
              test -L "$entry"
              [[ "$(basename "$entry")" =~ ^[a-f0-9]{32}$ ]]
              destination="$(readlink "$entry")"
              case "$destination" in
                "$(realpath .audit/gym-platform)"|"$(realpath .audit/gym-platform/apps/api)")
                  rm -- "$entry"
                  ;;
                *)
                  echo "Unexpected host backlink: $destination"
                  exit 1
                  ;;
              esac
            done
          fi
          test -z "$(find "$store" -type l -print -quit)"
          files="$(find "$store" -type f | wc -l)"
          bytes="$(du -sb "$store" | cut -f1)"
          test "$files" -ge 50
          test "$files" -lt 90000
          test "$bytes" -lt 1992294400
          chmod -R a+rX "$store"
          chmod 755 "$store"
          echo "Real filtered Gym API cache: $files files; $bytes bytes."

      - name: Trusted network stage — fetch exact Prisma 7 Alpine-musl schema engine
        shell: bash
        run: |
          set -euo pipefail
          version='d1b3f377ca835d73fd50954a5e22128b9ebdd6b8'
          platform='linux-musl-openssl-3.0.x'
          base="https://binaries.prisma.sh/all_commits/$version/$platform/schema-engine.gz"
          engine="$(mktemp -d)"
          echo "GYM_PRISMA_ENGINE=$engine" >> "$GITHUB_ENV"
          curl --fail --location --silent --show-error --retry 3 --max-time 120 \
            "$base" --output "$engine/schema-engine.gz"
          curl --fail --location --silent --show-error --retry 3 --max-time 120 \
            "$base.sha256" --output "$engine/schema-engine.gz.sha256"
          raw_checksum="$(head -c 180 "$engine/schema-engine.gz.sha256")"
          compressed_sha="$(sha256sum "$engine/schema-engine.gz" | cut -d' ' -f1)"
          echo "UPSTREAM_PRISMA_CHECKSUM_TEXT=$raw_checksum"
          echo "UPSTREAM_PRISMA_COMPRESSED_SHA256=$compressed_sha"
          checksum="$(printf '%s' "$raw_checksum" | grep -oE '[a-f0-9]{64}' | head -n 1)"
          [[ "$checksum" =~ ^[a-f0-9]{64}$ ]]
          test "$compressed_sha" = "$checksum"
          gzip -t "$engine/schema-engine.gz"
          gzip -dc "$engine/schema-engine.gz" > "$engine/schema-engine"
          test "$(stat -c%s "$engine/schema-engine")" -ge 1000000
          test "$(stat -c%s "$engine/schema-engine")" -le 180000000
          test "$(head -c4 "$engine/schema-engine" | od -An -tx1 | tr -d ' \n')" = '7f454c46'
          chmod 555 "$engine/schema-engine"
          rm "$engine/schema-engine.gz" "$engine/schema-engine.gz.sha256"
          actual="$(sha256sum "$engine/schema-engine" | cut -d' ' -f1)"
          echo "GYPIN_PRISMA_ENGINE_SHA256=$actual"
          test "$actual" = 'REPLACE_WITH_REVIEWED_MUSL_ENGINE_SHA256'
          chmod 755 "$engine"

      - name: Build verified CI-only Node runner image
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull=false \
            --tag gym-dev-hub-node-runner:v1 \
            --file packages/runner/Dockerfile packages/runner

      - name: Generate pinned Prisma Client from real API offline cache in private Docker
        shell: bash
        run: |
          set -euo pipefail
          name="gym-devhub-prisma-proof-${{ github.run_id }}"
          cleanup() { docker rm -f "$name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          docker create --name "$name" --pull=never \
            --network=none --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges --user=65534:65534 \
            --ipc=none --pids-limit=128 --memory=5g --cpus=2 \
            --tmpfs='/workspace:rw,nosuid,nodev,noexec,size=3072m,mode=1777' \
            --tmpfs='/results:rw,nosuid,nodev,noexec,size=32m,mode=1777' \
            --tmpfs='/tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777' \
            --mount "type=bind,source=$GYM_SOURCE_SNAPSHOT,target=/source,readonly" \
            --mount "type=bind,source=$GYM_SOURCE_MANIFEST,target=/manifest,readonly" \
            --mount "type=bind,source=$GYM_API_PNPM_STORE,target=/store,readonly" \
            --mount "type=bind,source=$GYM_PRISMA_ENGINE,target=/engine,readonly" \
            --stop-timeout=3 --entrypoint /usr/bin/node \
            gym-dev-hub-node-runner:v1 \
            /opt/gym-dev-hub/prisma-native-preflight.mjs > /dev/null

          docker inspect "$name" --format '{{json .HostConfig}}' | jq -e '
            .NetworkMode == "none" and .ReadonlyRootfs == true
            and .Privileged == false and (.CapDrop | any(.[]; ascii_downcase == "all"))
            and .Memory == 5368709120 and .NanoCpus == 2000000000
            and .PidsLimit == 128 and .IpcMode == "none"
            and (.Mounts | length) == 4
            and ([.Mounts[] | select(.Type == "bind" and .ReadOnly == true) | .Target] | sort) == ["/engine","/manifest","/source","/store"]
            and (.Tmpfs["/workspace"] | contains("noexec"))
            and (.Tmpfs["/results"] | contains("noexec"))
            and (.Tmpfs["/tmp"] | contains("noexec"))
          '
          docker inspect "$name" --format '{{json .Mounts}}' | jq -e '
            length == 4 and
            ([.[] | select(.Type == "bind" and .RW == false) | .Destination] | sort) == ["/engine","/manifest","/source","/store"]
          '
          test "$(docker inspect "$name" --format '{{.Config.User}}')" = '65534:65534'
          reply="$(docker start --attach "$name")"
          test "$(docker inspect "$name" --format '{{.State.ExitCode}}')" = '0'
          printf '%s\n' "$reply" | jq -e '
            .protocol == 1 and .event == "pinned-prisma-client-generated-in-private-overlay"
            and .sourceCommit == "7104f723c4ee7b81e7b9b64e9c9483aea344ef7a"
            and .sourceTree == "2c140e1e740b3dd8cc7582db726f46b54b73b334"
            and .sourceManifestSha256 == "dd06a6e61c08886f8c783ffe51152854ed6aeca44115659fabc884d5b180bb0b"
            and .prismaVersion == "7.10.1"
            and .schemaEngineCommit == "d1b3f377ca835d73fd50954a5e22128b9ebdd6b8"
            and (.schemaEngineSha256 | test("^[a-f0-9]{64}$"))
            and .schemaEnginePlatform == "linux-musl-openssl-3.0.x"
            and .outputPath == "apps/api/src/infra/database/generated/prisma"
            and .generatedFiles >= 6 and .generatedBytes >= 2000
            and .networkEnabled == false and .sourceReadOnly == true
            and .privateProjectCopy == true and .fullOfflineDependenciesInstalled == true
            and .dependencyLifecycleScriptsExecuted == false
            and .prismaClientGeneratorExecuted == true
            and .nativeLifecycleScriptsExecuted == false
            and .apiTypecheckExecuted == false and .operatorGrantConsumed == false
            and .taskExecutionEnabled == false
          '
          docker rm "$name"
          test -z "$(docker ps -aq --filter "name=^$name$")"
          echo 'Pinned Prisma Client generated from offline dependencies into a private disposable worktree.'

      - name: Reject tampered Prisma schema and incomplete pnpm cache
        shell: bash
        run: |
          set -euo pipefail
          altered="$(mktemp -d)"
          empty="$(mktemp -d)"
          cleanup() {
            rm -rf "$altered" "$empty" "$GYM_SOURCE_SNAPSHOT" "$GYM_SOURCE_MANIFEST" "$GYM_API_PNPM_STORE" "$GYM_PRISMA_ENGINE"
          }
          trap cleanup EXIT
          chmod 755 "$altered" "$empty"
          cp -a "$GYM_SOURCE_SNAPSHOT/." "$altered/"
          printf '\n// unreviewed schema mutation\n' >> "$altered/apps/api/prisma/schemas/schema.prisma"
          for scenario in tampered-prisma-schema missing-cache; do
            source="$GYM_SOURCE_SNAPSHOT"
            store="$GYM_API_PNPM_STORE"
            if [ "$scenario" = tampered-prisma-schema ]; then source="$altered"; fi
            if [ "$scenario" = missing-cache ]; then store="$empty"; fi
            if docker run --rm --pull=never \
              --network=none --read-only --cap-drop=ALL \
              --security-opt=no-new-privileges --user=65534:65534 \
              --ipc=none --pids-limit=128 --memory=5g --cpus=2 \
              --tmpfs='/workspace:rw,nosuid,nodev,noexec,size=3072m,mode=1777' \
              --tmpfs='/results:rw,nosuid,nodev,noexec,size=32m,mode=1777' \
              --tmpfs='/tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777' \
              --mount "type=bind,source=$source,target=/source,readonly" \
              --mount "type=bind,source=$GYM_SOURCE_MANIFEST,target=/manifest,readonly" \
              --mount "type=bind,source=$store,target=/store,readonly" \
              --mount "type=bind,source=$GYM_PRISMA_ENGINE,target=/engine,readonly" \
              --stop-timeout=3 --entrypoint /usr/bin/node \
              gym-dev-hub-node-runner:v1 \
              /opt/gym-dev-hub/prisma-native-preflight.mjs >/dev/null 2>&1; then
              echo "Invalid API cache preflight accepted: $scenario"
              exit 1
            fi
          done
          test -z "$(docker ps -aq --filter 'ancestor=gym-dev-hub-node-runner:v1')"
          echo 'Tampered Prisma schema and empty store denied before private generation.'
