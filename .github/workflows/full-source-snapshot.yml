name: Immutable Full Gym Platform Source Snapshot

on:
  pull_request:
    paths:
      - 'packages/runner/**'
      - '.github/workflows/full-source-snapshot.yml'
  push:
    branches: [main]
    paths:
      - 'packages/runner/**'
      - '.github/workflows/full-source-snapshot.yml'

permissions:
  contents: read

concurrency:
  group: immutable-full-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    name: Pinned 1258-file read-only source mount / no execution
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch reviewed public Gym Platform commit (no credentials persisted)
        uses: actions/checkout@v4
        with:
          repository: sauron9521/gym-platform
          ref: 7104f723c4ee7b81e7b9b64e9c9483aea344ef7a
          path: .audit/gym-platform
          fetch-depth: 1
          persist-credentials: false

      - name: Build canonical Git manifest and tracked-only archive
        shell: bash
        run: |
          set -euo pipefail
          repo='.audit/gym-platform'
          test "$(git -C "$repo" rev-parse HEAD)" = '7104f723c4ee7b81e7b9b64e9c9483aea344ef7a'
          test "$(git -C "$repo" rev-parse HEAD^{tree})" = '2c140e1e740b3dd8cc7582db726f46b54b73b334'

          snapshot="$(mktemp -d)"
          manifest="$(mktemp -d)"
          echo "GYM_SOURCE_SNAPSHOT=$snapshot" >> "$GITHUB_ENV"
          echo "GYM_SOURCE_MANIFEST=$manifest" >> "$GITHUB_ENV"
          chmod 755 "$snapshot" "$manifest"
          git -C "$repo" ls-tree -r --long -z HEAD > "$manifest/tracked-files.bin"

          # This is a reviewed Git tree, but never export symlinks, gitlinks
          # or other archive entry types into the Docker input.
          node --input-type=module - "$manifest/tracked-files.bin" <<'NODE'
          import { readFileSync } from 'node:fs';
          const lines = readFileSync(process.argv[2], 'utf8').split('\0');
          if (lines.pop() !== '') throw new Error('Malformed NUL manifest');
          let count = 0;
          let bytes = 0;
          let executables = 0;
          for (const line of lines) {
            const match = /^(100644|100755) blob ([0-9a-f]{40}) +([0-9]+)\t([^\r\n\t]+)$/.exec(line);
            if (!match) throw new Error('Non-regular file, symlink or submodule in source tree');
            if (match[1] === '100755') executables++;
            count++;
            bytes += Number(match[3]);
          }
          if (count !== 1258 || bytes !== 6241392 || executables !== 1) {
            throw new Error('Pinned source manifest shape unexpectedly changed');
          }
          console.log('Reviewed tracked source: ' + count + ' files, ' + bytes + ' bytes.');
          NODE
          echo "MANIFEST_SHA256=$(sha256sum "$manifest/tracked-files.bin" | cut -d' ' -f1)"
          (cd "$repo" && git archive --format=tar HEAD) | tar -xf - -C "$snapshot"
          test ! -d "$snapshot/.git"
          test -z "$(find "$snapshot" -type l -print -quit)"
          test "$(find "$snapshot" -type f | wc -l)" -eq 1258
          echo 'Tracked-only archive staged; .git and untracked files excluded.'

      - name: Build reviewed CI-only diagnostic runner image
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull=false --tag gym-dev-hub-node-runner:v1 \
            --file packages/runner/Dockerfile packages/runner

      - name: Audit exact full source snapshot in no-network read-only Docker
        shell: bash
        run: |
          set -euo pipefail
          name="gym-devhub-full-source-${{ github.run_id }}"
          cleanup() { docker rm -f "$name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          docker create --name "$name" --pull=never \
            --network=none --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges --user=65534:65534 \
            --ipc=none --pids-limit=128 --memory=536870912 --cpus=1 \
            --tmpfs='/tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777' \
            --mount "type=bind,source=$GYM_SOURCE_SNAPSHOT,target=/source,readonly" \
            --mount "type=bind,source=$GYM_SOURCE_MANIFEST,target=/manifest,readonly" \
            --stop-timeout=3 --entrypoint /usr/bin/node \
            gym-dev-hub-node-runner:v1 /opt/gym-dev-hub/full-source-audit.mjs >/dev/null

          docker inspect "$name" --format '{{json .HostConfig}}' | jq -e '
            .NetworkMode == "none" and .ReadonlyRootfs == true
            and .Privileged == false and (.CapDrop | any(.[]; ascii_downcase == "all"))
            and .Memory == 536870912 and .NanoCpus == 1000000000
            and .PidsLimit == 128 and .IpcMode == "none"
            and (.Mounts | length) == 2
            and ([.Mounts[] | select(.Type == "bind" and .ReadOnly == true) | .Target] | sort) == ["/manifest","/source"]
            and (.Tmpfs["/tmp"] | contains("noexec"))
          '
          docker inspect "$name" --format '{{json .Mounts}}' | jq -e '
            length == 2 and
            ([.[] | select(.Type == "bind" and .RW == false) | .Destination] | sort) == ["/manifest","/source"]
          '
          test "$(docker inspect "$name" --format '{{.Config.User}}')" = '65534:65534'
          reply="$(docker start --attach "$name")"
          test "$(docker inspect "$name" --format '{{.State.ExitCode}}')" = '0'
          printf '%s\n' "$reply" | jq -e '
            .protocol == 1 and .event == "immutable-full-source-snapshot-verified"
            and .repository == "sauron9521/gym-platform"
            and .sourceCommit == "7104f723c4ee7b81e7b9b64e9c9483aea344ef7a"
            and .sourceTree == "2c140e1e740b3dd8cc7582db726f46b54b73b334"
            and (.manifestSha256 | test("^[a-f0-9]{64}$"))
            and .trackedFiles == 1258 and .sourceBytes == 6241392
            and .executableFileModes == 1 and .exactTrackedTree == true
            and .untrackedOrGitMetadataMounted == false
            and .sourceMountedReadOnly == true
            and .sourceCodeExecuted == false and .dependenciesInstalled == false
            and .projectScriptsExecuted == false and .arbitraryExecutionEnabled == false
            and .operatorGrantIssued == false
          '
          docker rm "$name"
          test -z "$(docker ps -aq --filter "name=^$name$")"
          echo 'Pinned source checked completely, without executing any Gym Platform code.'

      - name: Reject modified, extra, symlinked and missing files and a forged manifest
        shell: bash
        run: |
          set -euo pipefail
          modified="$(mktemp -d)"
          bad_manifest="$(mktemp -d)"
          cleanup() {
            rm -rf "$modified" "$bad_manifest" "$GYM_SOURCE_SNAPSHOT" "$GYM_SOURCE_MANIFEST"
          }
          trap cleanup EXIT
          chmod 755 "$modified" "$bad_manifest"
          for scenario in modified extra symlink missing manifest; do
            cp -a "$GYM_SOURCE_SNAPSHOT/." "$modified/"
            input="$GYM_SOURCE_SNAPSHOT"
            records="$GYM_SOURCE_MANIFEST"
            case "$scenario" in
              modified)
                printf '\n// unexpected edit\n' >> "$modified/packages/domain/src/index.ts"
                input="$modified"
                ;;
              extra)
                printf 'untracked\n' > "$modified/rogue.txt"
                input="$modified"
                ;;
              symlink)
                rm "$modified/packages/i18n/src/locales.ts"
                ln -s /dev/null "$modified/packages/i18n/src/locales.ts"
                input="$modified"
                ;;
              missing)
                rm "$modified/apps/mobile/src/features/exercises/lib/exercises-pagination.ts"
                input="$modified"
                ;;
              manifest)
                cp "$GYM_SOURCE_MANIFEST/tracked-files.bin" "$bad_manifest/tracked-files.bin"
                printf 'forged' >> "$bad_manifest/tracked-files.bin"
                records="$bad_manifest"
                ;;
            esac
            if docker run --rm --pull=never \
              --network=none --read-only --cap-drop=ALL \
              --security-opt=no-new-privileges --user=65534:65534 \
              --ipc=none --pids-limit=128 --memory=536870912 --cpus=1 \
              --tmpfs='/tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777' \
              --mount "type=bind,source=$input,target=/source,readonly" \
              --mount "type=bind,source=$records,target=/manifest,readonly" \
              --stop-timeout=3 --entrypoint /usr/bin/node \
              gym-dev-hub-node-runner:v1 /opt/gym-dev-hub/full-source-audit.mjs >/dev/null 2>&1; then
              echo "Unreviewed source or manifest unexpectedly accepted: $scenario"
              exit 1
            fi
            rm -rf "$modified"
            modified="$(mktemp -d)"
            chmod 755 "$modified"
          done
          test -z "$(docker ps -aq --filter 'ancestor=gym-dev-hub-node-runner:v1')"
          echo 'Changed, extra, missing and symlinked source + forged manifest all rejected.'
